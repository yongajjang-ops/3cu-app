<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3쿠션 당구 연습 노트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="3cu-app.png">
    <link rel="icon" type="image/png" href="3cu-app.png">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow-x: hidden; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); margin: 0; padding: 0; touch-action: manipulation; }
        .app-container { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; max-width: 100%; }
        .header { background: rgba(0,0,0,0.3); padding: 12px 16px; text-align: center; flex-shrink: 0; }
        .header h1 { color: #fff; font-size: 18px; margin: 0; }
        .tab-nav { display: flex; background: rgba(0,0,0,0.2); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #888; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #fff; background: rgba(255,255,255,0.1); border-bottom-color: #4CAF50; }
        .tab-content { flex: 1; }
        .tab-panel { display: none; padding: 12px; }
        .tab-panel.active { display: block; }
        .table-container { background: #0d0e10; border-radius: 8px; padding: 6px; box-shadow: 0 5px 20px rgba(0,0,0,0.6); margin-bottom: 12px; touch-action: none; -webkit-overflow-scrolling: auto; }
        #billiardTable { display: block; margin: 0 auto; border-radius: 4px; touch-action: none; }
        .memo-area { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; backdrop-filter: blur(10px); }
        .memo-area h3 { color: #fff; margin: 0 0 12px 0; font-size: 16px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; color: #aaa; margin-bottom: 6px; font-size: 13px; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 14px; border: none; border-radius: 8px; background: rgba(255,255,255,0.95); font-size: 16px; transition: all 0.3s ease; }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus { outline: none; box-shadow: 0 0 10px rgba(100,200,255,0.5); }
        .input-group textarea { min-height: 70px; resize: none; }
        .save-buttons-row { display: flex; gap: 8px; }
        .save-btn { flex: 1; padding: 14px 8px; background: linear-gradient(145deg, #4CAF50, #388E3C); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
        .save-btn:active { transform: scale(0.98); }
        .saved-list-container { padding-bottom: 20px; }
        .saved-list-header { color: #fff; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .saved-item { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; margin-bottom: 10px; transition: all 0.2s ease; }
        .saved-item:active { background: rgba(255,255,255,0.15); }
        .saved-item-content { display: flex; gap: 10px; align-items: center; }
        .saved-item-thumbnail { width: 100px; height: 50px; object-fit: contain; border-radius: 6px; background: #1a1a2e; flex-shrink: 0; }
        .saved-item-info { flex: 1; min-width: 0; }
        .saved-item-name { color: #fff; font-weight: bold; font-size: 14px; }
        .saved-item-date { color: #888; font-size: 10px; margin-top: 2px; }
        .saved-item-memo { color: #999; font-size: 11px; margin-top: 4px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .saved-item-buttons { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        .item-btn { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.2s ease; white-space: nowrap; }
        .item-btn.delete { background: #f44336; color: white; }
        .item-btn:active { transform: scale(0.98); }
        .empty-message { color: #888; text-align: center; padding: 40px 20px; font-size: 14px; line-height: 1.6; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: white; padding: 14px 24px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); opacity: 0; transition: all 0.3s ease; z-index: 1000; font-size: 14px; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { background: linear-gradient(145deg, #4CAF50, #388E3C); }
        .toast.error { background: linear-gradient(145deg, #f44336, #d32f2f); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: #2d2d2d; border-radius: 16px; padding: 24px; max-width: 320px; width: 100%; text-align: center; }
        .modal h4 { color: #fff; margin: 0 0 12px 0; font-size: 18px; }
        .modal p { color: #aaa; margin: 0 0 20px 0; font-size: 14px; }
        .modal-buttons { display: flex; gap: 12px; }
        .modal-btn { flex: 1; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; transition: all 0.2s ease; }
        .modal-btn.confirm { background: #f44336; color: white; }
        .modal-btn.cancel { background: #666; color: white; }
        .modal-btn:active { transform: scale(0.98); }
        .edit-mode-banner { background: linear-gradient(145deg, #FF9800, #F57C00); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .edit-mode-banner span { color: white; font-weight: bold; font-size: 13px; }
        .cancel-edit-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .cancel-edit-btn:active { background: rgba(255,255,255,0.3); }
        .tool-buttons { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.2s ease; background: rgba(255,255,255,0.15); color: #fff; }
        .tool-btn:active { transform: scale(0.98); }
        .tool-btn.active { background: #4CAF50; color: white; }
        .tool-btn.danger { background: #f44336; color: white; }
        .color-picker-inline { display: none; gap: 6px; align-items: center; margin-left: 8px; }
        .color-picker-inline.show { display: flex; }
        .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s ease; }
        .color-btn:active { transform: scale(0.95); }
        .color-btn.active { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .color-btn.white { background: #ffffff; }
        .color-btn.red { background: #ff4444; }
        .color-btn.yellow { background: #ffdd00; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header"><h1>3쿠션 당구 연습 노트</h1></div>
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('table')">배치</button>
            <button class="tab-btn" onclick="switchTab('saved')">저장 목록</button>
        </div>
        <div class="tab-content">
            <div class="tab-panel active" id="panel-table">
                <div class="table-container"><canvas id="billiardTable"></canvas></div>
                <div class="tool-buttons">
                    <button class="tool-btn" id="line-mode-btn" onclick="toggleLineMode()">직선</button>
                    <button class="tool-btn" id="draw-mode-btn" onclick="toggleDrawMode()">그리기</button>
                    <button class="tool-btn danger" onclick="undoDrawing()">지우기</button>
                    <button class="tool-btn" id="hide-btn" onclick="toggleHideDrawings()">숨기기</button>
                    <div id="color-picker" class="color-picker-inline">
                        <button class="color-btn white active" onclick="selectColor('#ffffff', this)"></button>
                        <button class="color-btn red" onclick="selectColor('#ff4444', this)"></button>
                        <button class="color-btn yellow" onclick="selectColor('#ffdd00', this)"></button>
                    </div>
                </div>
                <div class="memo-area">
                    <h3>배치 정보</h3>
                    <div id="edit-mode-banner" class="edit-mode-banner" style="display: none;">
                        <span id="edit-mode-text">수정 중</span>
                        <button class="cancel-edit-btn" onclick="cancelEdit()">취소</button>
                    </div>
                    <div class="input-group">
                        <label for="layout-name">배치 이름</label>
                        <select id="layout-name">
                            <option value="뒤돌">뒤돌</option>
                            <option value="옆돌">옆돌</option>
                            <option value="앞돌">앞돌</option>
                            <option value="비껴">비껴</option>
                            <option value="뱅크">뱅크</option>
                            <option value="스트록">스트록</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="layout-memo">메모</label>
                        <textarea id="layout-memo" placeholder="연습 포인트를 작성하세요..."></textarea>
                    </div>
                    <div class="save-buttons-row">
                        <button class="save-btn" id="save-btn" onclick="saveLayout()">저장</button>
                        <button class="save-btn" id="save-new-btn" style="display: none; background: linear-gradient(145deg, #9C27B0, #7B1FA2);" onclick="saveAsNew()">새로저장</button>
                        <button class="save-btn" style="background: linear-gradient(145deg, #2196F3, #1976D2);" onclick="saveAsImage()">이미지</button>
                    </div>
                </div>
            </div>
            <div class="tab-panel" id="panel-saved">
                <div class="saved-list-container">
                    <div class="saved-list-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17,21 17,13 7,13 7,21"></polyline>
                            <polyline points="7,3 7,8 15,8"></polyline>
                        </svg>
                        저장된 배치 목록
                    </div>
                    <div id="saved-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <h4>배치 삭제</h4>
            <p>정말로 이 배치를 삭제하시겠습니까?</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeDeleteModal()">취소</button>
                <button class="modal-btn confirm" onclick="confirmDelete()">삭제</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        // ===== Constants =====
        const TABLE_RATIO    = 0.54;
        const TABLE_COLOR    = '#2d7ab8';
        const CUSHION_COLOR  = '#266a9e';
        const RAIL_COLOR     = '#3a3d42';
        const FRAME_COLOR    = '#1a1c20';
        const PC_TABLE_WIDTH  = 750;
        const PC_BALL_RADIUS  = 10;
        const PC_BORDER_WIDTH = 25;
        const PC_CUSHION_WIDTH = 12;
        const BALL_COLORS = {
            red:    { main: '#cc2222', light: '#ff5555', dark: '#991111' },
            yellow: { main: '#e6a800', light: '#ffc033', dark: '#b38600' },
            white:  { main: '#d0d0d0', light: '#ffffff', dark: '#a0a0a0' }
        };

        // ===== State =====
        let BALL_RADIUS, BORDER_WIDTH, CUSHION_WIDTH;
        let canvas, ctx, canvasRect;
        let tableWidth, tableHeight;
        let draggingBall = null;
        let dragOffset = { x: 0, y: 0 };
        let deleteTargetId = null;
        let balls = { red: null, yellow: null, white: null };
        let drawingHistory = [];
        let toolMode = null;  // 'line' | 'draw' | null
        let currentLine = null;
        let currentPath = null;
        let currentColor = '#ffffff';
        let editingLayoutId = null;
        let drawingsHidden = false;

        // ===== Init =====
        window.onload = function() { initCanvas(); loadSavedList(); };

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            if (tab === 'table') {
                document.querySelector('.tab-btn:first-child').classList.add('active');
                document.getElementById('panel-table').classList.add('active');
            } else {
                document.querySelector('.tab-btn:last-child').classList.add('active');
                document.getElementById('panel-saved').classList.add('active');
            }
            window.scrollTo(0, 0);
        }

        function initCanvas() {
            canvas = document.getElementById('billiardTable');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove',  handleTouchMove,  { passive: false });
            canvas.addEventListener('touchend',   handleTouchEnd,   { passive: false });
            canvas.addEventListener('mousedown',  handleMouseDown);
            canvas.addEventListener('mousemove',  handleMouseMove);
            canvas.addEventListener('mouseup',    handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);
        }

        function initBallPositions() {
            const cx   = tableWidth / 2;
            const ph   = tableHeight - (BORDER_WIDTH + CUSHION_WIDTH) * 2;
            const sy   = BORDER_WIDTH + CUSHION_WIDTH;
            balls.red    = { x: cx, y: sy + ph * 0.25 };
            balls.yellow = { x: cx, y: sy + ph * 0.5  };
            balls.white  = { x: cx, y: sy + ph * 0.75 };
            drawTable();
        }

        function resizeCanvas() {
            tableWidth  = Math.min(canvas.parentElement.clientWidth - 12, 300);
            tableHeight = tableWidth / TABLE_RATIO;
            const scale   = tableWidth / (PC_TABLE_WIDTH / 2);
            BALL_RADIUS   = PC_BALL_RADIUS   * scale;
            BORDER_WIDTH  = PC_BORDER_WIDTH  * scale;
            CUSHION_WIDTH = PC_CUSHION_WIDTH * scale;
            canvas.width  = tableWidth;
            canvas.height = tableHeight;
            canvasRect = canvas.getBoundingClientRect();
            if (balls.red || balls.yellow || balls.white) drawTable();
            else initBallPositions();
        }

        // ===== Rendering =====
        function drawTable() {
            ctx.fillStyle = FRAME_COLOR;
            ctx.fillRect(0, 0, tableWidth, tableHeight);
            const fw = 3;
            ctx.fillStyle = RAIL_COLOR;
            ctx.fillRect(fw, fw, tableWidth - fw*2, tableHeight - fw*2);
            ctx.fillStyle = CUSHION_COLOR;
            ctx.fillRect(BORDER_WIDTH, BORDER_WIDTH, tableWidth - BORDER_WIDTH*2, tableHeight - BORDER_WIDTH*2);
            const px = BORDER_WIDTH + CUSHION_WIDTH;
            const py = BORDER_WIDTH + CUSHION_WIDTH;
            const pw = tableWidth  - (BORDER_WIDTH + CUSHION_WIDTH) * 2;
            const ph = tableHeight - (BORDER_WIDTH + CUSHION_WIDTH) * 2;
            ctx.fillStyle = TABLE_COLOR;
            ctx.fillRect(px, py, pw, ph);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(px, py, pw, ph);
            drawGridLines(px, py, pw, ph);
            drawDiamonds(px, py, pw, ph);
            drawLines();
            drawBalls();
        }

        function drawGridLines(sx, sy, w, h) {
            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            for (let i = 1; i < 4; i++) {
                const x = sx + i * (w / 4);
                ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x, sy + h); ctx.stroke();
            }
            for (let i = 1; i < 8; i++) {
                const y = sy + i * (h / 8);
                ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + w, y); ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        function drawDiamonds(px, py, pw, ph) {
            const size   = 2;
            const top    = BORDER_WIDTH / 2 + 1;
            const bottom = tableHeight - BORDER_WIDTH / 2 - 1;
            const left   = BORDER_WIDTH / 2 + 1;
            const right  = tableWidth  - BORDER_WIDTH / 2 - 1;
            for (let i = 0; i <= 4; i++) {
                const x = px + i * (pw / 4);
                drawDiamondMarker(x, top, size);
                drawDiamondMarker(x, bottom, size);
            }
            for (let i = 0; i <= 8; i++) {
                const y = py + i * (ph / 8);
                drawDiamondMarker(left,  y, size);
                drawDiamondMarker(right, y, size);
            }
        }

        function drawDiamondMarker(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = '#e8e8e8';
            ctx.fill();
        }

        function drawBalls() {
            for (const color of ['red', 'yellow', 'white']) {
                if (balls[color]) drawBall(balls[color].x, balls[color].y, color);
            }
        }

        function drawBall(x, y, color) {
            const c = BALL_COLORS[color];
            const g = ctx.createRadialGradient(
                x - BALL_RADIUS * 0.35, y - BALL_RADIUS * 0.35, BALL_RADIUS * 0.1,
                x, y, BALL_RADIUS
            );
            g.addColorStop(0, c.light);
            g.addColorStop(0.6, c.main);
            g.addColorStop(1, c.dark);
            ctx.beginPath();
            ctx.arc(x, y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }

        function drawSegment(item) {
            ctx.strokeStyle = item.color || '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(item.startX, item.startY);
            ctx.lineTo(item.endX, item.endY);
            ctx.stroke();
        }

        function drawFreehand(points, color) {
            if (points.length < 2) return;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
        }

        function drawLines() {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (!drawingsHidden) {
                for (const item of drawingHistory) {
                    if (item.type === 'line')     drawSegment(item);
                    else if (item.type === 'freehand') drawFreehand(item.points, item.color || '#00ff00');
                }
            }
            if (currentLine) drawSegment(currentLine);
            if (currentPath) drawFreehand(currentPath.points, currentPath.color);
        }

        // ===== Tool mode =====
        function toggleLineMode() { toolMode = toolMode === 'line' ? null : 'line'; updateToolButtons(); }
        function toggleDrawMode() { toolMode = toolMode === 'draw' ? null : 'draw'; updateToolButtons(); }

        function updateToolButtons() {
            document.getElementById('line-mode-btn').classList.toggle('active', toolMode === 'line');
            document.getElementById('draw-mode-btn').classList.toggle('active', toolMode === 'draw');
            document.getElementById('color-picker').classList.toggle('show', toolMode !== null);
        }

        function selectColor(color, btn) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function undoDrawing() {
            if (!drawingHistory.length) { showToast('지울 항목이 없습니다'); return; }
            drawingHistory.pop();
            drawTable();
        }

        function toggleHideDrawings() {
            if (!drawingHistory.length) { showToast('그려진 내용이 없습니다'); return; }
            drawingsHidden = !drawingsHidden;
            document.getElementById('hide-btn').textContent = drawingsHidden ? '보이기' : '숨기기';
            drawTable();
        }

        // ===== Input helpers =====
        function getPointerCoords(e) {
            const src = e.touches ? e.touches[0] : e;
            return { x: src.clientX - canvasRect.left, y: src.clientY - canvasRect.top };
        }

        function startDrawingStroke(x, y) {
            if (toolMode === 'line') { currentLine = { startX: x, startY: y, endX: x, endY: y, color: currentColor }; return true; }
            if (toolMode === 'draw') { currentPath = { type: 'freehand', points: [{ x, y }], color: currentColor }; return true; }
            return false;
        }

        function updateDrawingStroke(x, y) {
            if (toolMode === 'line' && currentLine) { currentLine.endX = x; currentLine.endY = y; drawTable(); return true; }
            if (toolMode === 'draw' && currentPath) { currentPath.points.push({ x, y }); drawTable(); return true; }
            return false;
        }

        function finishDrawingStroke() {
            if (toolMode === 'line' && currentLine) {
                const dx = currentLine.endX - currentLine.startX;
                const dy = currentLine.endY - currentLine.startY;
                if (Math.sqrt(dx*dx + dy*dy) > 5) drawingHistory.push({ ...currentLine, type: 'line' });
                currentLine = null; drawTable(); return true;
            }
            if (toolMode === 'draw' && currentPath) {
                if (currentPath.points.length > 2) drawingHistory.push(currentPath);
                currentPath = null; drawTable(); return true;
            }
            return false;
        }

        function moveDraggedBall(x, y) {
            if (!draggingBall) return;
            const b = BORDER_WIDTH + CUSHION_WIDTH + BALL_RADIUS;
            balls[draggingBall].x = Math.max(b, Math.min(tableWidth  - b, x - dragOffset.x));
            balls[draggingBall].y = Math.max(b, Math.min(tableHeight - b, y - dragOffset.y));
            drawTable();
        }

        // ===== Event handlers =====
        function handleTouchStart(e) {
            e.preventDefault();
            const { x, y } = getPointerCoords(e);
            if (startDrawingStroke(x, y)) return;
            const hit = getBallAtPosition(x, y);
            if (hit) { draggingBall = hit; dragOffset.x = x - balls[hit].x; dragOffset.y = y - balls[hit].y; }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const { x, y } = getPointerCoords(e);
            if (updateDrawingStroke(x, y)) return;
            moveDraggedBall(x, y);
        }

        function handleTouchEnd()  { if (finishDrawingStroke()) return; draggingBall = null; }

        function handleMouseDown(e) {
            const { x, y } = getPointerCoords(e);
            if (startDrawingStroke(x, y)) return;
            const hit = getBallAtPosition(x, y);
            if (hit) { draggingBall = hit; dragOffset.x = x - balls[hit].x; dragOffset.y = y - balls[hit].y; }
        }

        function handleMouseMove(e) {
            const { x, y } = getPointerCoords(e);
            if (updateDrawingStroke(x, y)) return;
            moveDraggedBall(x, y);
        }

        function handleMouseUp() { if (finishDrawingStroke()) return; draggingBall = null; }

        // ===== Utilities =====
        function getBallAtPosition(x, y) {
            const r = BALL_RADIUS * 1.5;
            for (const color of ['red', 'yellow', 'white']) {
                const ball = balls[color];
                if (ball && Math.hypot(x - ball.x, y - ball.y) <= r) return color;
            }
            return null;
        }

        function captureRotatedCanvas() {
            const temp = document.createElement('canvas');
            temp.width  = canvas.height;
            temp.height = canvas.width;
            const tCtx = temp.getContext('2d');
            tCtx.translate(0, temp.height);
            tCtx.rotate(-Math.PI / 2);
            tCtx.drawImage(canvas, 0, 0);
            return temp;
        }

        function resetForm() {
            document.getElementById('layout-name').value = '뒤돌';
            document.getElementById('layout-memo').value = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== Save =====
        function saveLayout() {
            const name = document.getElementById('layout-name').value;
            const memo = document.getElementById('layout-memo').value.trim();
            if (!balls.red && !balls.yellow && !balls.white) { showToast('최소 하나의 공을 배치해주세요', 'error'); return; }

            const snapshot = {
                name, memo,
                balls: JSON.parse(JSON.stringify(balls)),
                drawingHistory: JSON.parse(JSON.stringify(drawingHistory)),
                date: new Date().toLocaleDateString('ko-KR'),
                tableSize: { width: tableWidth, height: tableHeight },
                thumbnail: captureRotatedCanvas().toDataURL('image/png')
            };

            let layouts = JSON.parse(localStorage.getItem('3cu-layouts') || '[]');

            if (editingLayoutId) {
                const index = layouts.findIndex(l => l.id === editingLayoutId);
                if (index !== -1) {
                    layouts[index] = { ...layouts[index], ...snapshot };
                    localStorage.setItem('3cu-layouts', JSON.stringify(layouts));
                    editingLayoutId = null;
                    updateEditModeUI(null);
                    loadSavedList();
                    resetForm();
                    showToast('수정이 저장되었습니다!', 'success');
                    return;
                }
            }

            layouts.unshift({ id: Date.now(), ...snapshot });
            localStorage.setItem('3cu-layouts', JSON.stringify(layouts));
            loadSavedList();
            resetForm();
            showToast('저장되었습니다!', 'success');
        }

        function saveAsNew() {
            editingLayoutId = null;
            updateEditModeUI(null);
            saveLayout();
        }

        // ===== Saved list =====
        function loadSavedList() {
            const container = document.getElementById('saved-list');
            const layouts = JSON.parse(localStorage.getItem('3cu-layouts') || '[]');
            if (!layouts.length) {
                container.innerHTML = '<div class="empty-message">저장된 배치가 없습니다.<br><br>공을 배치하고 저장해보세요!</div>';
                return;
            }
            container.innerHTML = layouts.map(layout => `
                <div class="saved-item" onclick="editLayout(${layout.id})" style="cursor: pointer;">
                    <div class="saved-item-content">
                        ${layout.thumbnail ? `<img class="saved-item-thumbnail" src="${layout.thumbnail}" alt="미리보기">` : ''}
                        <div class="saved-item-info">
                            <div class="saved-item-name">${escapeHtml(layout.name)}</div>
                            <div class="saved-item-date">${layout.date}</div>
                            ${layout.memo ? `<div class="saved-item-memo">${escapeHtml(layout.memo)}</div>` : ''}
                        </div>
                        <div class="saved-item-buttons">
                            <button class="item-btn delete" onclick="event.stopPropagation(); showDeleteModal(${layout.id})">삭제</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function editLayout(id) { loadLayoutData(id, true); }

        function loadLayoutData(id, isEditMode) {
            const layouts = JSON.parse(localStorage.getItem('3cu-layouts') || '[]');
            const layout = layouts.find(l => l.id === id);
            if (!layout) { showToast('배치를 찾을 수 없습니다', 'error'); return; }

            document.getElementById('layout-name').value = layout.name;
            document.getElementById('layout-memo').value = layout.memo || '';
            editingLayoutId = isEditMode ? id : null;
            updateEditModeUI(isEditMode ? layout.name : null);

            switchTab('table');

            setTimeout(() => {
                resizeCanvas();

                const saved = layout.tableSize || { width: tableWidth, height: tableHeight };
                const sx = saved.width  > 0 ? tableWidth  / saved.width  : 1;
                const sy = saved.height > 0 ? tableHeight / saved.height : 1;

                const src = layout.balls;
                balls = {
                    red:    src.red    ? { x: src.red.x    * sx, y: src.red.y    * sy } : null,
                    yellow: src.yellow ? { x: src.yellow.x * sx, y: src.yellow.y * sy } : null,
                    white:  src.white  ? { x: src.white.x  * sx, y: src.white.y  * sy } : null
                };

                const history = layout.drawingHistory || [];
                const legacy  = layout.lines || [];

                if (history.length > 0) {
                    drawingHistory = history.map(item => {
                        if (item.type === 'line')     return { type: 'line', startX: item.startX * sx, startY: item.startY * sy, endX: item.endX * sx, endY: item.endY * sy, color: item.color || '#ffffff' };
                        if (item.type === 'freehand') return { type: 'freehand', points: item.points.map(p => ({ x: p.x * sx, y: p.y * sy })), color: item.color || '#00ff00' };
                        return item;
                    });
                } else if (legacy.length > 0) {
                    drawingHistory = legacy.map(l => ({ type: 'line', startX: l.startX * sx, startY: l.startY * sy, endX: l.endX * sx, endY: l.endY * sy, color: l.color || '#ffffff' }));
                } else {
                    drawingHistory = [];
                }

                drawingsHidden = false;
                document.getElementById('hide-btn').textContent = '숨기기';
                toolMode = null;
                updateToolButtons();
                drawTable();
                showToast(isEditMode ? '수정 모드로 배치를 불러왔습니다' : '배치를 불러왔습니다', 'success');
            }, 50);
        }

        // ===== Edit mode UI =====
        function updateEditModeUI(layoutName) {
            const active = layoutName && editingLayoutId;
            document.getElementById('edit-mode-banner').style.display = active ? 'flex' : 'none';
            if (active) document.getElementById('edit-mode-text').textContent = `"${layoutName}" 수정 중`;
            document.getElementById('save-btn').textContent     = active ? '수정' : '저장';
            document.getElementById('save-new-btn').style.display = active ? 'block' : 'none';
        }

        function cancelEdit() {
            editingLayoutId = null;
            updateEditModeUI(null);
            toolMode = null;
            updateToolButtons();
            resetForm();
            drawingHistory = [];
            drawingsHidden = false;
            document.getElementById('hide-btn').textContent = '숨기기';
            initBallPositions();
            showToast('수정이 취소되었습니다');
        }

        // ===== Delete modal =====
        function showDeleteModal(id)  { deleteTargetId = id; document.getElementById('delete-modal').classList.add('show'); }
        function closeDeleteModal()   { deleteTargetId = null; document.getElementById('delete-modal').classList.remove('show'); }

        function confirmDelete() {
            if (!deleteTargetId) return;
            let layouts = JSON.parse(localStorage.getItem('3cu-layouts') || '[]');
            layouts = layouts.filter(l => l.id !== deleteTargetId);
            localStorage.setItem('3cu-layouts', JSON.stringify(layouts));
            loadSavedList();
            closeDeleteModal();
            showToast('삭제되었습니다');
        }

        // ===== Image export =====
        function saveAsImage() {
            if (!balls.red && !balls.yellow && !balls.white) { showToast('최소 하나의 공을 배치해주세요', 'error'); return; }
            const link = document.createElement('a');
            link.download = `${document.getElementById('layout-name').value || '당구배치'}_${new Date().toISOString().slice(0, 10)}.png`;
            link.href = captureRotatedCanvas().toDataURL('image/png');
            link.click();
            showToast('이미지가 저장되었습니다!', 'success');
        }

        // ===== Toast =====
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
